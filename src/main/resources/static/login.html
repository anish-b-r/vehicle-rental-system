<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — DriveEase</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Simple Header -->
  <header class="py-3 bg-white border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand navbar-brand-custom" href="/index.html">
        <div class="brand-icon-box">
          <i class="bi bi-car-front-fill"></i>
        </div>
        <span>DriveEase</span>
      </a>
      <a href="/index.html" class="btn btn-sm btn-de-outline">
        <i class="bi bi-arrow-left"></i> Back to Fleet
      </a>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="auth-card">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-dark mb-1">Welcome Back</h2>
          <p class="text-muted small">Sign in to manage your bookings and access premium fleet rentals.</p>
        </div>

        <!-- Error Notification Alert -->
        <div class="alert alert-danger d-none py-2 px-3 small" id="login-error-alert" role="alert">
          <!-- Filled dynamically -->
        </div>

        <!-- Login Form -->
        <form id="login-form">
          <div class="mb-3">
            <label class="form-label-custom" for="login-email">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control form-control-custom border-start-0" id="login-email" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label-custom mb-0" for="login-password">Password</label>
              <a href="#" class="small text-muted text-decoration-none">Forgot password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control form-control-custom border-start-0" id="login-password" placeholder="••••••••" required>
            </div>
          </div>

          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="remember-me" checked>
            <label class="form-check-label small text-muted" for="remember-me">Remember this session</label>
          </div>

          <button type="submit" class="btn btn-de-primary w-100 py-2 justify-content-center" id="login-submit-btn">
            Sign In <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </form>

        <!-- Quick 1-Click Evaluation Credentials -->
        <div class="mt-4 pt-3 border-top text-center">
          <span class="d-block small text-muted fw-bold text-uppercase mb-2" style="font-size: 0.72rem;">
            Demo Quick-Fill for Evaluators:
          </span>
          <div class="d-flex justify-content-center gap-2">
            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillDemoCredentials('customer')">
              <i class="bi bi-person me-1"></i> Customer Login
            </button>
            <button type="button" class="btn btn-sm btn-outline-dark" onclick="fillDemoCredentials('admin')">
              <i class="bi bi-shield-lock me-1"></i> Admin Login
            </button>
          </div>
          <div class="small text-muted mt-2" style="font-size: 0.78rem;">
            Customer: <strong class="text-dark">john@example.com</strong> / <strong class="text-dark">customer123</strong> &bull; Admin: <strong class="text-dark">admin@driveease.com</strong> / <strong class="text-dark">admin123</strong>
          </div>
        </div>

        <div class="text-center mt-4 pt-2">
          <span class="small text-muted">Don't have an account yet? </span>
          <a href="/register.html" class="small fw-semibold text-dark text-decoration-underline">Register now</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application & Auth JS -->
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
