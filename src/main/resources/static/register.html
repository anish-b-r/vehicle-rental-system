<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — DriveEase</title>
  <!-- Bootstrap 5 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <!-- Simple Header -->
  <header class="py-3 bg-white border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand navbar-brand-custom" href="/index.html">
        <div class="brand-icon-box">
          <i class="bi bi-car-front-fill"></i>
        </div>
        <span>DriveEase</span>
      </a>
      <a href="/login.html" class="btn btn-sm btn-de-outline">
        Already have an account? Sign In
      </a>
    </div>
  </header>

  <main class="py-5">
    <div class="container">
      <div class="auth-card">
        <div class="text-center mb-4">
          <h2 class="fw-bold text-dark mb-1">Create an Account</h2>
          <p class="text-muted small">Join DriveEase to reserve premium cars and motorbikes instantly.</p>
        </div>

        <!-- Error Alert -->
        <div class="alert alert-danger d-none py-2 px-3 small" id="register-error-alert" role="alert">
          <!-- Populated dynamically -->
        </div>

        <!-- Registration Form -->
        <form id="register-form">
          <div class="mb-3">
            <label class="form-label-custom" for="reg-fullname">Full Legal Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control form-control-custom border-start-0" id="reg-fullname" placeholder="John Doe" required minlength="2">
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label-custom" for="reg-email">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control form-control-custom border-start-0" id="reg-email" placeholder="john@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label-custom" for="reg-phone">Phone Number</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-telephone text-muted"></i></span>
              <input type="tel" class="form-control form-control-custom border-start-0" id="reg-phone" placeholder="+1 (555) 000-0000" required>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <label class="form-label-custom" for="reg-password">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control form-control-custom border-start-0" id="reg-password" placeholder="Min. 6 chars" required minlength="6">
              </div>
            </div>
            <div class="col-md-6">
              <label class="form-label-custom" for="reg-confirm-password">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                <input type="password" class="form-control form-control-custom border-start-0" id="reg-confirm-password" placeholder="Repeat password" required minlength="6">
              </div>
            </div>
          </div>

          <div class="mb-4 form-check">
            <input type="checkbox" class="form-check-input" id="reg-terms" required checked>
            <label class="form-check-label small text-muted" for="reg-terms">
              I agree to the <a href="#" class="text-dark fw-semibold">Terms of Service</a> & <a href="#" class="text-dark fw-semibold">Rental Policy</a>
            </label>
          </div>

          <button type="submit" class="btn btn-de-primary w-100 py-2 justify-content-center" id="register-submit-btn">
            Create Account <i class="bi bi-arrow-right ms-1"></i>
          </button>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <span class="small text-muted">Already registered? </span>
          <a href="/login.html" class="small fw-semibold text-dark text-decoration-underline">Sign In here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Application & Auth JS -->
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
