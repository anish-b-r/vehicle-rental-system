spring.application.name=driveease
server.port=8080

# Default Database: In-memory H2 with MySQL compatibility mode for instant zero-config launch
# To switch to MySQL 8, either change these properties or run with: --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:driveease_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Accessible at /h2-console for database inspection)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
